[project]
name = "micro-crm-backend"
version = "0.1.0"
description = "AI-powered micro-CRM backend: who needs attention, why, and what to do next."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=1.7",
    "openai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in defaults is the FastAPI idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better as natural paragraphs than as wrapped code.
"app/services/ai/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
